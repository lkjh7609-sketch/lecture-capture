# 수업캡처 Windows 설치 파일 자동 빌드
# main에 push하면 빌드 후 Releases에 올림(로그인 없이 받기)
# 고정 링크: https://github.com/lkjh7609-sketch/lecture-capture/releases/latest/download/LectureCapture-Setup.exe
name: 수업캡처 설치 파일
on:
  workflow_dispatch:
  push:
    paths: ["tools/수업캡처/**", ".github/workflows/lecture-capture.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
        working-directory: tools/수업캡처
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: exe 빌드
        run: call build_exe.bat nopause
      - name: 실행 점검 + 화면 스크린샷
        shell: pwsh
        timeout-minutes: 4
        run: |
          $shots = Join-Path $env:RUNNER_TEMP "shots"
          $env:LC_ROOT = Join-Path $env:RUNNER_TEMP "lcroot"
          New-Item -ItemType Directory -Force $env:LC_ROOT | Out-Null
          $p = Start-Process dist\LectureCapture\LectureCapture.exe -ArgumentList "--selftest", $shots -PassThru -Wait
          if (Test-Path "$shots\error.txt") { Get-Content "$shots\error.txt"; exit 1 }
          if ($p.ExitCode -ne 0) { "exit code $($p.ExitCode)"; exit 1 }
          Get-ChildItem $shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7
      - name: Inno Setup 준비
        run: if not exist "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" choco install innosetup -y --no-progress
      - name: 설치 파일 만들기
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: LectureCapture-Setup
          path: tools/수업캡처/Output/*.exe
          retention-days: 30
      - name: Releases에 올리기
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          f=$(ls Output/LectureCapture-Setup-*.exe | head -1)
          ver=$(basename "$f" .exe); ver=${ver#LectureCapture-Setup-}
          cp "$f" Output/LectureCapture-Setup.exe
          gh release view "v$ver" >/dev/null 2>&1 || gh release create "v$ver" --title "수업캡처 $ver" --notes "LectureCapture-Setup.exe 를 받아 실행. Windows의 PC 보호 창이 뜨면 추가 정보 → 실행."
          gh release upload "v$ver" "$f" Output/LectureCapture-Setup.exe --clobber
